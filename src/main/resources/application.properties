# ===============================
# Application
# ===============================
spring.application.name=lamzytech-news-api
server.port=8080

# ===============================
# PostgreSQL Datasource
# ===============================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# ===============================
# JWT Configuration
# ===============================
# 256-bit+ secret, base64 or plain string (min 32 chars). CHANGE THIS IN PRODUCTION.
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse123456
# Token validity in milliseconds (default 24 hours)
app.jwt.expiration-ms=86400000

# ===============================
# Jackson
# ===============================
#spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.lamzytech.news=DEBUG
